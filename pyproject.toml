[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-from-scratch"
version = "0.2.0"
description = "GPT-2 inference from scratch in PyTorch: KV cache, batched, speculative and continuous-batching decoding, with benchmarks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.1,<3"]

[project.optional-dependencies]
hf = ["transformers>=4.40,<6"]  # only for loading trained GPT-2 weights and the tokenizer
plots = ["matplotlib>=3.7,<4"]
serve = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1"]
data = ["datasets>=2.18,<5"]  # optional: prompts from OpenAssistant oasst1 for the load test
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-asyncio>=0.23,<2",
  "transformers>=4.40,<6",
  "matplotlib>=3.7,<4",
  "numpy>=1.26,<3",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "httpx>=0.27,<1",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "pre-commit>=3.7,<5",
]

[tool.setuptools.packages.find]
include = ["infer*"]

[tool.setuptools.package-data]
infer = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=infer --cov-report=term-missing:skip-covered"

[tool.coverage.run]
omit = ["infer/plots.py", "infer/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE", "T20"]
ignore = ["RUF001", "RUF002", "RUF003", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"infer/__main__.py" = ["T20"]  # prints generated text for the user

[tool.mypy]
python_version = "3.11"
packages = ["infer"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
