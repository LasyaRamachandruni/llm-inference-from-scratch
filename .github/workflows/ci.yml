name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TORCH_VERSION: "2.14.1"

jobs:
  checks:
    # lint, types and tests on CPU (tiny random models; no downloads needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch + locked dependencies)
        run: |
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/lock-dev-py312.txt
          pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q --cov-report=xml
        env:
          HF_HUB_OFFLINE: "1"  # the tests build tiny models; they must not reach the network
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  server-smoke:
    # the server answers a streaming request end to end (random gpt2-shaped weights, CPU)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/lock-serve-py312.txt
          pip install --no-deps -e .
      - name: Start the server and stream one completion
        env:
          INFER_MODEL: distilgpt2
          HF_HUB_OFFLINE: "1"
        run: |
          python -m infer.serving.server &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sfN localhost:8000/v1/completions -H 'content-type: application/json' \
            -d '{"prompt": "hello", "max_tokens": 8, "stream": true, "ignore_eos": true}' | tee out.txt
          grep -q '\[DONE\]' out.txt
          python -m infer.serving.loadtest http --requests 8 --concurrency 4 --max-new 16

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm-inference-from-scratch .
